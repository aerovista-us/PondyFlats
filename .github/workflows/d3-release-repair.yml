name: Temporary Design 3 release repair

on:
  push:
    branches:
      - codex/design3-execution

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed Design 3 fixes
        run: python3 scripts/d3-ci-repair.py

      - name: Syntax checks
        run: |
          node --check js/lot2-design-3.js
          node --check js/lot2-design-3-plan-closure.js
          node --check scripts/d3-render-qa.mjs

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Full repository gates
        run: npm run gates

      - name: Verify freeze and Design 1 / Design 2 isolation
        shell: bash
        run: |
          git fetch origin main
          grep -q "3de5309fb5c87046acbba3ac37bc1c1eca2718344f3f704e50d28daa414f8625" js/lot2-design-3.js
          git diff --check
          git diff --exit-code origin/main -- packages/design-1-client packages/design-1-presenter packages/design-2-client packages/design-2-presenter

      - name: Commit verified repair and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/d3-release-repair.yml scripts/d3-ci-repair.py
          git config user.name "AeroVista QA"
          git config user.email "aechovistaus@gmail.com"
          git add -A
          git status --short
          git commit -m "Fix Design 3 release blockers [d3-ci-repair]"
          git push origin HEAD:codex/design3-execution
