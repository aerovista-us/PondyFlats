name: Temporary Design 3 final blocker verification

on:
  push:
    branches:
      - codex/design3-execution

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final blocker fixes
        run: python3 scripts/d3-resolve-final-blockers.py

      - name: Syntax checks
        run: |
          node --check js/lot2-design-3.js
          node --check js/lot2-design-3-plan-closure.js
          node --check scripts/d3-render-qa.mjs
          node --check js/lot2-export.js

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Full repository gates
        run: npm run gates

      - name: Verify truth and frozen boundaries
        shell: bash
        run: |
          git fetch origin main
          grep -q "3de5309fb5c87046acbba3ac37bc1c1eca2718344f3f704e50d28daa414f8625" js/lot2-design-3.js
          grep -q "data-proof-scope=\"threshold-approach\"" js/lot2-design-3.js
          grep -qi "full garage enclosure / parking fit is not claimed" d3-site.html
          grep -q "projectAxonOpening" js/lot2-design-3.js
          git diff --check
          git diff --exit-code origin/main -- packages/design-1-client packages/design-1-presenter packages/design-2-client packages/design-2-presenter

      - name: Commit verified fixes and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/d3-final-blockers.yml scripts/d3-resolve-final-blockers.py
          git config user.name "AeroVista QA"
          git config user.email "aerovistaus@gmail.com"
          git add -A
          git status --short
          git commit -m "Resolve final Design 3 review blockers [d3-final]"
          git push origin HEAD:codex/design3-execution
