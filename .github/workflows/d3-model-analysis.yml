name: Temporary Design 3 model-analysis verification

on:
  push:
    branches:
      - codex/design3-execution
    paths:
      - .github/workflows/d3-model-analysis.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply model-analysis correction
        run: python3 scripts/d3-align-model-analysis.py

      - name: Syntax checks
        run: |
          node --check js/lot2-design-3.js
          node --check scripts/d3-render-qa.mjs
          node --check js/lot2-design-3-plan-closure.js

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Full repository gates
        run: npm run gates

      - name: Verify model truth and frozen boundaries
        shell: bash
        run: |
          git fetch origin main
          grep -q "verdict:'CONDITIONAL'" js/lot2-design-3.js
          grep -q "status:'APPROACH VERIFIED'" js/lot2-design-3.js
          grep -q "scope:'threshold-approach'" js/lot2-design-3.js
          grep -q "status:'ADVISORY'" js/lot2-design-3.js
          ! grep -q "Full-size SUV / pickup circulation passed" js/lot2-design-3.js
          ! grep -q "wet-core tolerance, daylight, and mass coherence all pass" js/lot2-design-3.js
          grep -q "3de5309fb5c87046acbba3ac37bc1c1eca2718344f3f704e50d28daa414f8625" js/lot2-design-3.js
          git diff --check
          git diff --exit-code origin/main -- packages/design-1-client packages/design-1-presenter packages/design-2-client packages/design-2-presenter

      - name: Commit verified correction and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/d3-model-analysis.yml scripts/d3-align-model-analysis.py
          git config user.name "AeroVista QA"
          git config user.email "aerovistaus@gmail.com"
          git add -A
          git status --short
          git commit -m "Align Design 3 model analysis with unresolved advisories [d3-final-model]"
          git push origin HEAD:codex/design3-execution
