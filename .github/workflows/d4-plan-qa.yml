name: Design 4 plan closure QA

on:
  push:
    branches:
      - design4/rear-22-discovery
    paths:
      - js/lot2-design-4-plan-closure.js
      - d4-plans.html
      - .github/workflows/d4-plan-qa.yml

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design4/rear-22-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Plan model gates
        run: |
          node --check js/lot2-design-4-plan-closure.js
          node <<'NODE'
          const assert=require('assert');
          const p=require('./js/lot2-design-4-plan-closure.js');
          const a=p.analyze();
          console.log(JSON.stringify(a,null,2));
          assert.equal(a.verdict,'PASS');
          assert.equal(a.failures.length,0);
          for(const u of ['A','B']){
            assert.equal(a.units[u].ok,true);
            assert.equal(a.units[u].bedrooms,3);
            assert.equal(a.units[u].entry.ok,true);
            assert(a.units[u].stairOverlapSf>=10);
            assert.equal(a.units[u].levels.ground.ok,true);
            assert.equal(a.units[u].levels.upper.ok,true);
          }
          assert.equal(a.checks.wetCore.blocking,false);
          NODE
      - name: Locate Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Browser QA at four widths
        run: |
          mkdir -p /tmp/d4-plan-qa
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/d4-plan-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom http://127.0.0.1:8000/d4-plans.html > /tmp/d4-plan-qa/d4-plans.dom.html
          grep -q 'Diagrammed plan geometry · PASS' /tmp/d4-plan-qa/d4-plans.dom.html
          grep -q 'data-plan-verdict="PASS"' /tmp/d4-plan-qa/d4-plans.dom.html
          grep -q 'data-bubble-verdict="PASS"' /tmp/d4-plan-qa/d4-plans.dom.html
          test "$(grep -o '<svg' /tmp/d4-plan-qa/d4-plans.dom.html | wc -l)" -ge 3
          ! grep -qi 'ReferenceError\|TypeError\|renderer failed' /tmp/d4-plan-qa/d4-plans.dom.html
          for SIZE in 1440,1100 1024,900 768,900 390,900; do
            TAG="${SIZE/,/x}"
            "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=3000 --window-size="$SIZE" --screenshot="/tmp/d4-plan-qa/${TAG}-d4-plans.png" http://127.0.0.1:8000/d4-plans.html
          done
      - name: Upload plan QA
        uses: actions/upload-artifact@v4
        with:
          name: design4-plan-qa
          path: /tmp/d4-plan-qa/
          retention-days: 14
