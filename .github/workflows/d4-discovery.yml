name: Design 4 rear garage discovery

on:
  push:
    branches:
      - design4/rear-22-discovery
    paths:
      - scripts/d4-discovery.js
      - js/lot2-sot.js
      - js/lot2-geometry.js
      - js/lot2-access.js
      - docs/lot2-design-4-rules.md
      - docs/lot2-design-4-brief.json
      - .github/workflows/d4-discovery.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design4/rear-22-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Design 4 discovery
        run: node scripts/d4-discovery.js
      - name: Commit discovery evidence
        run: |
          git config user.name "AeroVista"
          git config user.email "aerovistaus@gmail.com"
          git add docs/lot2-design-4-discovery.md docs/lot2-design-4-discovery.json qa-artifacts/design4-discovery
          if git diff --cached --quiet; then
            echo "No discovery output changes"
          else
            git commit -m "Record Design 4 discovery results [skip ci]"
            git push origin HEAD:design4/rear-22-discovery
          fi
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: design4-rear-22-discovery
          path: |
            docs/lot2-design-4-discovery.md
            docs/lot2-design-4-discovery.json
            qa-artifacts/design4-discovery/
          retention-days: 14
