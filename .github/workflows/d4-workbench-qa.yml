name: Design 4 Workbench self-audit

on:
  push:
    branches: [design4/rear-22-discovery]
    paths:
      - 'js/lot2-design-4.js'
      - 'js/lot2-design-4-plan-closure.js'
      - 'js/lot2-design-4-architecture.js'
      - 'js/lot2-workbench-audit.js'
      - 'scripts/d4-workbench-search.js'
      - '.github/workflows/d4-workbench-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design4/rear-22-discovery
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Workbench modules
        run: |
          node --check js/lot2-workbench-audit.js
          node --check js/lot2-design-4.js
          node --check js/lot2-design-4-plan-closure.js
          node --check js/lot2-design-4-architecture.js
          node --check scripts/d4-workbench-search.js
      - name: Plan closure and architectural truth gates
        run: |
          node <<'NODE'
          const assert=require('assert');
          const p=require('./js/lot2-design-4-plan-closure.js');
          const a=require('./js/lot2-design-4-architecture.js');
          const pm=p.analyze(),am=a.analyze();
          assert.equal(pm.verdict,'PASS');
          assert.equal(pm.checks.circulation.ok,true);
          assert.equal(pm.units.A.levels.upper.circulation.ok,true);
          assert.equal(pm.units.B.levels.upper.circulation.ok,true);
          assert.equal(am.checks.openingContract.ok,true);
          assert.equal(am.checks.polygonFaces.ok,true);
          for(const face of ['east','west','north','south']){
            const svg=a.renderElev(face);
            assert(svg.includes('data-world-face-segment='));
          }
          const m=a.renderAxon('massing'),c=a.renderAxon('clean');
          for(const svg of [m,c]){
            assert(svg.includes('data-opening="door"'));
            assert(svg.includes('data-opening="window"'));
            assert(svg.includes('#b3261e'));
            assert(svg.includes('#2367b1'));
          }
          console.log(JSON.stringify({plans:pm.checks.circulation.status,openingContract:am.checks.openingContract,polygonFaces:am.checks.polygonFaces},null,2));
          NODE
      - name: Workbench four-stall autonomous search
        run: node scripts/d4-workbench-search.js
      - name: Upload Workbench evidence
        uses: actions/upload-artifact@v4
        with:
          name: d4-workbench-${{ github.sha }}
          path: qa-artifacts/design4-workbench/
          retention-days: 14
