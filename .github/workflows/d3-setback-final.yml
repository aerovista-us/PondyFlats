name: Temporary Design 3 setback verification

on:
  push:
    branches:
      - codex/design3-execution
    paths:
      - .github/workflows/d3-setback-final.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conditional setback evidence patch
        run: python3 scripts/d3-setback-final.py

      - name: Syntax checks
        run: |
          node --check js/lot2-design-3.js
          node --check js/lot2-design-3-plan-closure.js
          node --check scripts/d3-render-qa.mjs
          node --check scripts/export-packages.js

      - name: Locate Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      - name: Full repository gates
        run: npm run gates

      - name: Verify setback truth and frozen boundaries
        shell: bash
        run: |
          git fetch origin main
          grep -q "const SETBACKS=" js/lot2-design-3.js
          grep -q "status:'CONDITIONAL'" js/lot2-design-3.js
          grep -q "sideAssignment:'UNCONFIRMED'" js/lot2-design-3.js
          grep -q "SETBACKS · CONDITIONAL" d3-site.html
          grep -q "SETBACKS · CONDITIONAL" packages/design-3-client/site.html
          grep -q "data-setback-status" js/lot2-design-3.js
          grep -q "setbackMeta" scripts/d3-render-qa.mjs
          grep -q "3de5309fb5c87046acbba3ac37bc1c1eca2718344f3f704e50d28daa414f8625" js/lot2-design-3.js
          git diff --check
          git diff --exit-code origin/main -- packages/design-1-client packages/design-1-presenter packages/design-2-client packages/design-2-presenter
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          prior=subprocess.check_output(['git','show','d37a52ab890f59ae0596acbbedcd08e0d37409ac:js/lot2-design-3.js'],text=True)
          current=Path('js/lot2-design-3.js').read_text()
          pat=r"const LOCK=\{.*?\n\};"
          a=re.search(pat,prior,re.S).group(0)
          b=re.search(pat,current,re.S).group(0)
          assert a==b, 'CFB-716 LOCK changed'
          print('CFB-716 LOCK unchanged')
          PY

      - name: Preserve QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: design3-setback-final-qa
          path: |
            /tmp/pondy-d3-gate/*.png
            /tmp/pondy-d3-gate/qa-results.json
            /tmp/pondy-d3-package-gate/*.png
            /tmp/pondy-d3-package-gate/qa-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified correction and remove temporary runner
        shell: bash
        run: |
          rm -f .github/workflows/d3-setback-final.yml scripts/d3-setback-final.py
          git config user.name "AeroVista QA"
          git config user.email "aerovistaus@gmail.com"
          git add js/lot2-design-3.js d3-site.html scripts/d3-render-qa.mjs packages/design-3-client packages/design-3-presenter
          git add -u .github/workflows/d3-setback-final.yml scripts/d3-setback-final.py
          git status --short
          git commit -m "Add conditional Design 3 setback evidence [d3-setbacks]"
          git push origin HEAD:codex/design3-execution
