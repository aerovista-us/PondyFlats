name: Design 4B rotation study

on:
  push:
    branches:
      - 'feature/design4b-rotated-garages'
    paths:
      - 'js/lot2-design-4.js'
      - 'js/lot2-design-4b.js'
      - 'js/lot2-workbench-audit.js'
      - 'scripts/d4b-rotation-study.js'
      - 'scripts/d4b-static-repair-search.js'
      - 'scripts/d4b-layout-search.js'
      - '.github/workflows/d4b-rotation-study.yml'
  workflow_dispatch:

concurrency:
  group: d4b-rotation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax gates
        run: |
          node --check js/lot2-workbench-audit.js
          node --check js/lot2-design-4.js
          node --check js/lot2-design-4b.js
          node --check scripts/d4b-rotation-study.js
          node --check scripts/d4b-static-repair-search.js
          node --check scripts/d4b-layout-search.js
      - name: Validate encoded 35 degree 4B study geometry
        run: |
          node - <<'NODE'
          const D4B=require('./js/lot2-design-4b.js');
          const r=D4B.staticAudit();
          console.log(JSON.stringify(r,null,2));
          if(D4B.ANGLE_DEG!==35) throw new Error('Design 4B Garage B angle drifted from 35 degrees');
          if(!r.fourStallProgramPreserved) throw new Error('Rotated Garage B no longer preserves the two-stall program');
          NODE
      - name: Run Design 4B static rotation study
        run: node scripts/d4b-rotation-study.js
      - name: Run Design 4B bounded repair search
        run: node scripts/d4b-static-repair-search.js
      - name: Run Design 4B whole-boundary joint layout search
        run: node scripts/d4b-layout-search.js
      - name: Show study summaries
        run: |
          cat qa-artifacts/design4b/rotation-study.md
          echo
          cat qa-artifacts/design4b/static-repair-search.md
          echo
          cat qa-artifacts/design4b/layout-search.md
      - name: Upload Design 4B evidence
        uses: actions/upload-artifact@v4
        with:
          name: design4b-rotation-study-${{ github.sha }}
          path: qa-artifacts/design4b/
          retention-days: 90
